<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="黑群晖 RR 引导排障笔记">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0F1B2E"/>
      <stop offset="1" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)" opacity="0.5"/>
  <circle cx="1080" cy="34" r="120" fill="#22D3EE" opacity="0.06"/>
  <circle cx="1180" cy="280" r="150" fill="#34D399" opacity="0.05"/>

  <!-- left copy -->
  <rect x="64" y="46" width="236" height="28" rx="14" fill="#0E7490" opacity="0.18" stroke="#22D3EE" stroke-opacity="0.35"/>
  <circle cx="80" cy="60" r="4" fill="#22D3EE"/>
  <text x="94" y="65" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="12" fill="#67E8F9" letter-spacing="1.2">XPENOLOGY · RR LOADER</text>

  <text x="64" y="140" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="44" font-weight="700" fill="#F8FAFC">黑群晖 RR 引导排障笔记</text>
  <text x="64" y="180" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" fill="#94A3B8">Synology Assistant 找不到 NAS</text>
  <text x="64" y="208" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" fill="#94A3B8">一次个人排障记录：从零包到无显示器恢复</text>

  <rect x="64" y="228" width="132" height="4" rx="2" fill="url(#accent)" filter="url(#softGlow)"/>

  <g font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="11">
    <rect x="64" y="254" width="88" height="24" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="108" y="270" text-anchor="middle" fill="#CBD5E1">J1900</text>
    <rect x="160" y="254" width="108" height="24" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="214" y="270" text-anchor="middle" fill="#CBD5E1">RR 26.3.0</text>
    <rect x="276" y="254" width="92" height="24" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="322" y="270" text-anchor="middle" fill="#CBD5E1">DSM 7.3</text>
    <rect x="376" y="254" width="112" height="24" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="432" y="270" text-anchor="middle" fill="#CBD5E1">HEADLESS</text>
  </g>

  <!-- right terminal card -->
  <rect x="704" y="42" width="432" height="216" rx="14" fill="#0A1120" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="704" y="42" width="432" height="34" rx="14" fill="#111C2E"/>
  <rect x="704" y="62" width="432" height="14" fill="#111C2E"/>
  <circle cx="726" cy="59" r="4.5" fill="#F87171"/>
  <circle cx="742" cy="59" r="4.5" fill="#FBBF24"/>
  <circle cx="758" cy="59" r="4.5" fill="#34D399"/>
  <text x="778" y="64" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="11" fill="#64748B">nas-recovery.log</text>
  <rect x="1036" y="50" width="84" height="20" rx="10" fill="#064E3B" stroke="#34D399" stroke-opacity="0.45"/>
  <circle cx="1050" cy="60" r="3.5" fill="#34D399"/>
  <text x="1060" y="64" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="10" fill="#6EE7B7">ONLINE</text>

  <g font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="12.5">
    <text x="728" y="104" fill="#64748B">$ cat user-config.yml</text>
    <text x="728" y="128" fill="#94A3B8">directboot: <tspan fill="#34D399">"false"</tspan></text>
    <text x="728" y="150" fill="#94A3B8">bootwait:   <tspan fill="#34D399">"300"</tspan></text>
    <text x="728" y="178" fill="#64748B">$ dhcp_probe.py --duration 120</text>
    <text x="728" y="200" fill="#22D3EE">mac=… type=DISCOVER</text>
    <text x="728" y="222" fill="#FBBF24">vendor='udhcp 1.30.1'</text>
    <text x="728" y="244" fill="#34D399">→ RR environment ready</text>
  </g>

  <rect x="0" y="298" width="1200" height="2" fill="url(#accent)" opacity="0.6"/>
</svg>
